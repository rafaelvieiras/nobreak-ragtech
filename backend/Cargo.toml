[package]
name = "nobreak-ragtech"
version = "0.2.1"
edition = "2021"
description = "Monitor open source para nobreaks Ragtech: lê a porta USB e serve um painel web"
license = "MIT"
repository = "https://github.com/rafaelvieiras/nobreak-ragtech"
rust-version = "1.75"

[dependencies]
serialport = { version = "4", default-features = false }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
mime_guess = { version = "2", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
