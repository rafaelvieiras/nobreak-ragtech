name: Release
# Publica ao criar uma tag `vX.Y.Z`:
#   - imagem multi-arquitetura em ghcr.io/<dono>/nobreak-ragtech
#   - binários estáticos + SHA256SUMS anexados à release do GitHub
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
env:
  IMAGEM: ghcr.io/${{ github.repository }}
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run check && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - run: cd backend && cargo test --locked

  binarios:
    needs: testes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { alvo: x86_64-unknown-linux-musl,        nome: linux-amd64 }
          - { alvo: aarch64-unknown-linux-musl,       nome: linux-arm64 }
          - { alvo: armv7-unknown-linux-musleabihf,   nome: linux-armv7 }
          - { alvo: arm-unknown-linux-musleabihf,     nome: linux-armv6 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.alvo }}" }
      - run: cd backend && cargo build --release --locked --target ${{ matrix.alvo }}
      - name: Empacotar
        run: |
          v="${GITHUB_REF_NAME}"
          d="nobreak-ragtech-${v}-${{ matrix.nome }}"
          mkdir "$d"
          cp "backend/target/${{ matrix.alvo }}/release/nobreak-ragtech" LICENSE README.md "$d/"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with: { name: "bin-${{ matrix.nome }}", path: "*.tar.gz" }

  docker:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [binarios, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "bin-*", merge-multiple: true, path: artefatos }
      - run: cd artefatos && sha256sum *.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artefatos/*
          body: |
            ## Docker
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
            Plataformas: `linux/amd64`, `linux/arm64`, `linux/arm/v7`, `linux/arm/v6`.
